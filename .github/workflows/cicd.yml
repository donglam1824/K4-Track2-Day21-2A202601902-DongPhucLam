name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: |
          dvc remote modify labstore credentialpath /tmp/sa-key.json
          dvc pull
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          f1_val=$(python -c 'import json; print(json.load(open("outputs/report.json"))["f1_score"])')
          echo "f1=$f1_val" >> $GITHUB_OUTPUT
      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          from google.cloud import storage
          import os
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          if not bucket_name: exit(0)
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("models/model.joblib")
          PYEOF
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              print(f"Quality gate failed: f1_score = {f1} < 0.65")
              exit(1)
          print(f"Quality gate passed: f1_score = {f1} >= 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 30
            curl -f http://localhost:8080/healthz || exit 1
